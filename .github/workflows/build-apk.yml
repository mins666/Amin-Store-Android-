name: Build Pashmak Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" "${ANDROID_SDK_ROOT:-/opt/android-sdk}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extract Pashmak project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'Pashmak_Store_*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Pashmak project ZIP not found"
            exit 1
          fi
          mkdir -p pashmak_project
          unzip -q "$ZIP_FILE" -d pashmak_project
          PROJECT_DIR="$(dirname "$(find pashmak_project -name settings.gradle -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Android project not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pashmak-Store-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
